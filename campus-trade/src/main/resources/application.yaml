server:
  port: 8084
hm:
  db:
    # 【本机/虚拟机环境直连，不依赖 Nacos】
    # 原先 DB 配置在 Nacos 的 shared-jdbc.yaml，但那是给 Docker Compose 用的
    # （host 写作容器服务名 mysql）。本机没有 Docker，解析该名字会报：
    #   UnknownHostException: mysql → Communications link failure → 接口 500
    # 现在写明真实地址，Nacos 被清空也能正常启动。
    host: 192.168.1.4
    port: 3306
    database: hm-trade
    un: root
    pw: 123
  swagger:
    title: 校园二手交易相关接口
    desc: 校园二手交易相关接口
    package: com.campus.trade.controller

spring:
  # 数据源与 hm.db 同源，避免依赖 Nacos 的 shared-jdbc.yaml（原因见 hm.db 注释）
  datasource:
    url: jdbc:mysql://${hm.db.host}:${hm.db.port}/${hm.db.database}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${hm.db.un}
    password: ${hm.db.pw}

  # 数据源与 hm.db 同源，避免依赖 Nacos 的 shared-jdbc.yaml（原因见 hm.db 注释）
  application:
    name: campus-trade
  profiles:
    active: local
  cloud:
    nacos:
      server-addr: 192.168.1.4:8848
  rabbitmq:
    host: 192.168.1.4
    port: 5672
    virtual-host: /hmall
    username: hmall
    password: 123
    # 【重要】关闭 requeue：监听方法抛异常时消息不再重回队列。
    # 默认 true 会导致：失败消息立即重投 → 无限死循环 → 日志刷屏
    # → 消费者被 MQ 判定 unresponsive 而关闭，整条队列失去处理能力。
    # 关闭后失败消息直接丢弃（本项目已在监听器内 try-catch 兜住异常并记日志）。
    listener:
      simple:
        default-requeue-rejected: false
        # 消费失败时重试次数（配合 requeue=false 也生效）
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    # 【说明】原为 debug：每个未登录请求会打 55 行堆栈（171 次≈近万行噪音）

    # 且 SQL 逐条打印淹没真实错误。现改 info，排查时临时调 debug。

    com.campus: info

  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  # 固定文档端口，避免随机高位端口与其他进程冲突导致启动失败
  port: 58904
  enable: true
  openapi:
    title: 校园二手交易服务接口文档
    description: "校园二手交易服务接口文档"
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.campus.trade.controller


